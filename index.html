<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potinho de Doações TikTok Live & LivePix</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Socket.io para Integração Real Streamlabs / LivePix -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.min.js"></script>
  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    .font-pop {
      font-family: 'Fredoka', sans-serif;
    }

    /* Container do Pote */
    .jar-container {
      position: relative;
      width: 280px;
      height: 380px;
      perspective: 1000px;
      transition: transform 0.3s ease;
    }

    /* Tampa do Pote com efeito 3D */
    .jar-lid {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) rotateX(35deg) rotateZ(-12deg);
      width: 210px;
      height: 52px;
      background: linear-gradient(135deg, #4b5563 0%, #1f2937 60%, #111827 100%);
      border-radius: 50%;
      box-shadow: 
        inset 0 4px 6px rgba(255, 255, 255, 0.4),
        inset 0 -4px 8px rgba(0, 0, 0, 0.8),
        0 10px 15px rgba(0, 0, 0, 0.5);
      border: 2px solid #6b7280;
      z-index: 25;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }

    .jar-lid-inner {
      position: absolute;
      top: 4px;
      left: 5%;
      width: 90%;
      height: 80%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.3) 100%);
    }

    /* Corpo do Pote de Vidro */
    .jar-body {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 290px;
      border-radius: 35px 35px 50px 50px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 100%);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 4px solid rgba(255, 255, 255, 0.6);
      box-shadow: 
        inset 0 0 25px rgba(255, 255, 255, 0.5),
        inset -10px -10px 20px rgba(0, 0, 0, 0.2),
        inset 10px 10px 20px rgba(255, 255, 255, 0.3),
        0 20px 35px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    /* Gargalo do Vidro */
    .jar-neck {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 196px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 15;
      transition: opacity 0.4s ease;
    }

    /* Brilhos Reflexivos */
    .glass-highlight-left {
      position: absolute;
      top: 15px;
      left: 14px;
      width: 16px;
      height: 250px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.1) 70%, transparent 100%);
      border-radius: 10px;
      z-index: 22;
      pointer-events: none;
    }

    .glass-highlight-right {
      position: absolute;
      top: 20px;
      right: 14px;
      width: 8px;
      height: 230px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.05) 80%, transparent 100%);
      border-radius: 5px;
      z-index: 22;
      pointer-events: none;
    }

    /* Container do Líquido */
    .liquid-wrapper {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      transition: height 0.9s cubic-bezier(0.3, 0.8, 0.2, 1);
      overflow: hidden;
    }

    .liquid-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, var(--liquid-color, #3b82f6) 0%, #1d4ed8 60%, #1e3a8a 100%);
      opacity: 0.88;
      box-shadow: inset 0 10px 20px rgba(255, 255, 255, 0.4);
    }

    /* Ondas SVG Fluídas */
    .wave-svg {
      position: absolute;
      top: -30px;
      left: 0;
      width: 200%;
      height: 38px;
      fill: var(--liquid-color, #3b82f6);
      opacity: 0.9;
      animation: waveMove 2.8s linear infinite;
    }

    .wave-svg-back {
      position: absolute;
      top: -35px;
      left: -50%;
      width: 200%;
      height: 44px;
      fill: rgba(255, 255, 255, 0.45);
      opacity: 0.55;
      animation: waveMoveBack 4.2s linear infinite;
    }

    @keyframes waveMove {
      0% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(-25%) translateY(-2px); }
      100% { transform: translateX(-50%) translateY(0); }
    }

    @keyframes waveMoveBack {
      0% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(25%) translateY(3px); }
      100% { transform: translateX(50%) translateY(0); }
    }

    /* Bolhas na Água */
    .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 50%;
      bottom: -10px;
      animation: rise 3.5s infinite ease-in;
      pointer-events: none;
    }

    @keyframes rise {
      0% { bottom: -10px; transform: translateX(0) scale(0.5); opacity: 0; }
      50% { opacity: 0.8; }
      100% { bottom: 105%; transform: translateX(20px) scale(1.2); opacity: 0; }
    }

    /* Balanço do Pote (CORRIGIDO: Mantendo o translateX(-50%) centralizado) */
    .slosh-jar {
      animation: jarSlosh 0.5s ease-in-out;
    }

    @keyframes jarSlosh {
      0% { transform: translateX(-50%) rotate(0deg); }
      25% { transform: translateX(-50%) rotate(-3deg) translateY(2px); }
      50% { transform: translateX(-50%) rotate(3deg) translateY(-2px); }
      75% { transform: translateX(-50%) rotate(-1deg); }
      100% { transform: translateX(-50%) rotate(0deg); }
    }

    /* Tremor Pré-Explosão (CORRIGIDO) */
    .shake-jar {
      animation: jarShake 0.12s infinite alternate ease-in-out;
    }

    @keyframes jarShake {
      0% { transform: translateX(-50%) rotate(0deg) scale(1); }
      25% { transform: translateX(-53%) rotate(-4deg) scale(1.03); }
      75% { transform: translateX(-47%) rotate(4deg) scale(1.03); }
      100% { transform: translateX(-50%) rotate(0deg) scale(1.06); }
    }

    /* Recomposição Centralizada */
    .rebuilding-jar {
      animation: rebuildPulse 0.8s ease-out forwards;
    }

    @keyframes rebuildPulse {
      0% {
        transform: scale(0.2) rotate(15deg);
        opacity: 0;
        filter: brightness(2) blur(10px);
      }
      70% {
        transform: scale(1.1) rotate(-3deg);
        opacity: 0.9;
        filter: brightness(1.5) blur(0px);
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
        filter: brightness(1);
      }
    }

    /* Estilos de Abas Ativas */
    .tab-btn.active {
      background-color: #3b82f6;
      color: #ffffff;
    }

    /* Fundo Croma Key e Transparente */
    .bg-chroma { background-color: #00FF00 !important; }
    .bg-transparent-obs { background-color: transparent !important; }
  </style>
</head>
<body id="body" class="bg-slate-900 text-white min-h-screen flex flex-col md:flex-row items-center justify-center p-4 transition-colors duration-300">

  <!-- Canvas das Partículas da Explosão -->
  <canvas id="explosionCanvas" class="fixed inset-0 pointer-events-none z-50 w-full h-full"></canvas>

  <!-- WIDGET (O Pote de Vidro) -->
  <div id="widgetContainer" class="flex-1 flex flex-col items-center justify-center w-full min-h-[500px] relative transition-all duration-300">
    
    <div id="headerTextDisplay" class="font-pop text-2xl md:text-3xl font-extrabold text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] tracking-wide mb-2 text-center transition-all">
      Link na bio
    </div>

    <div id="jarWrapper" class="jar-container flex items-center justify-center">
      <div id="jarLid" class="jar-lid">
        <div class="jar-lid-inner"></div>
      </div>

      <div id="jarNeck" class="jar-neck"></div>

      <div id="jarBody" class="jar-body">
        <div class="glass-highlight-left"></div>
        <div class="glass-highlight-right"></div>

        <div id="liquidWrapper" class="liquid-wrapper">
          <svg class="wave-svg-back" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,0 C150,90 350,-40 500,40 C650,120 900,-20 1200,40 L1200,120 L0,120 Z"></path>
          </svg>
          
          <svg id="waveFront" class="wave-svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,0 C150,90 350,-40 500,40 C650,120 900,-20 1200,40 L1200,120 L0,120 Z"></path>
          </svg>

          <div id="liquidFill" class="liquid-fill"></div>

          <div class="bubble" style="left: 20%; width: 10px; height: 10px; animation-delay: 0s;"></div>
          <div class="bubble" style="left: 45%; width: 14px; height: 14px; animation-delay: 1.2s;"></div>
          <div class="bubble" style="left: 70%; width: 8px; height: 8px; animation-delay: 2.5s;"></div>
        </div>

        <div class="absolute inset-0 flex flex-col items-center justify-center z-30 pointer-events-none px-2 text-center">
          <span id="centerDisplay" class="font-pop text-4xl md:text-5xl font-black text-white drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] tracking-wider">
            0%
          </span>
        </div>
      </div>
    </div>

    <div id="footerTextDisplay" class="font-pop text-xl md:text-2xl font-bold text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] tracking-wide mt-2 text-center transition-all">
      Vamos encher o potinho?
    </div>
  </div>

  <!-- PAINEL DE CONTROLE -->
  <div id="controlPanel" class="w-full md:w-96 bg-slate-800/95 backdrop-blur-md p-5 rounded-2xl border border-slate-700 shadow-2xl z-40 my-4 md:my-0 max-h-[92vh] overflow-y-auto">
    
    <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-700">
      <h2 class="text-lg font-bold text-blue-400 flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
        Painel de Controle
      </h2>
      <button id="togglePanelBtn" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg text-slate-300 transition">
        Ocultar Painel
      </button>
    </div>

    <!-- MENU DE NAVEGAÇÃO (ABAS) -->
    <div class="grid grid-cols-4 gap-1 bg-slate-900/80 p-1 rounded-xl mb-4 text-[11px] font-semibold">
      <button onclick="switchTab('donations')" id="tabBtn-donations" class="tab-btn active py-1.5 rounded-lg transition text-slate-400 hover:text-white">
        💵 Doações
      </button>
      <button onclick="switchTab('appearance')" id="tabBtn-appearance" class="tab-btn py-1.5 rounded-lg transition text-slate-400 hover:text-white">
        🎨 Aparência
      </button>
      <button onclick="switchTab('settings')" id="tabBtn-settings" class="tab-btn py-1.5 rounded-lg transition text-slate-400 hover:text-white">
        🔊 Áudio/OBS
      </button>
      <button onclick="switchTab('connections')" id="tabBtn-connections" class="tab-btn py-1.5 rounded-lg transition text-slate-400 hover:text-white">
        🔗 Conexões
      </button>
    </div>

    <!-- ABA 1: DOAÇÕES E VALORES -->
    <div id="tab-donations" class="tab-content space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Modo de Exibição no Pote</label>
        <select id="displayModeSelect" onchange="changeDisplayMode()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-blue-500 font-medium">
          <option value="percent">Somente Porcentagem (%)</option>
          <option value="value">Somente Valor (R$)</option>
          <option value="none">Ocultar Texto (Somente Pote)</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Meta Total (R$)</label>
          <input id="targetInput" type="number" step="1" min="1" value="100" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-blue-500 font-bold">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Valor Atual (R$)</label>
          <input id="currentInput" type="number" step="0.5" min="0" value="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-blue-400 focus:outline-none focus:border-blue-500 font-bold">
        </div>
      </div>

      <!-- BOTÕES RÁPIDOS -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Adicionar Doação Rapidamente</label>
        <div class="grid grid-cols-5 gap-1.5">
          <button onclick="addAmount(1)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition active:scale-95">+1</button>
          <button onclick="addAmount(5)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition active:scale-95">+5</button>
          <button onclick="addAmount(10)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition active:scale-95">+10</button>
          <button onclick="addAmount(35)" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-lg text-xs transition active:scale-95">+35</button>
          <button onclick="addAmount(50)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition active:scale-95">+50</button>
        </div>
      </div>

      <!-- ADICIONAR VALOR ESPECÍFICO -->
      <div class="bg-slate-900/40 p-2.5 rounded-xl border border-slate-700/60">
        <label class="block text-xs font-semibold text-slate-300 mb-1">Adicionar Valor Específico (R$)</label>
        <div class="flex gap-2">
          <input id="customAmountInput" type="number" step="0.01" min="0.01" placeholder="Ex: 17,50" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-blue-500 font-bold">
          <button onclick="addCustomAmount()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 text-xs font-bold rounded-lg transition active:scale-95 shadow">Adicionar</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-700">
        <button onclick="triggerExplosionSequence(true)" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 px-2 rounded-lg text-xs transition active:scale-95 flex items-center justify-center gap-1 shadow">
          💥 Testar Explosão
        </button>
        <button onclick="resetJar(true)" class="bg-rose-600/80 hover:bg-rose-600 text-white font-bold py-2 px-2 rounded-lg text-xs transition">
          🔄 Zerar Meta
        </button>
      </div>
    </div>

    <!-- ABA 2: APARÊNCIA E TEXTOS -->
    <div id="tab-appearance" class="tab-content hidden space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Texto Superior</label>
        <input id="headerInput" type="text" value="Link na bio" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Texto Inferior</label>
        <input id="footerInput" type="text" value="Vamos encher o potinho?" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/60 space-y-3">
        <span class="text-xs font-bold text-blue-400 uppercase tracking-wider block">🎨 Cores & Fontes</span>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Cor Texto Pote</label>
            <input id="jarTextColorInput" type="color" value="#ffffff" class="w-full h-8 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Cor Textos Fora</label>
            <input id="outerTextColorInput" type="color" value="#ffffff" class="w-full h-8 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer">
          </div>
        </div>

        <div>
          <label class="block text-[11px] text-slate-400 mb-1">Tamanho da Fonte no Pote</label>
          <div class="flex items-center gap-2">
            <input id="jarFontSizeRange" type="range" min="20" max="70" value="48" oninput="updateFontStyles()" class="w-full accent-blue-500 cursor-pointer">
            <span id="jarFontSizeVal" class="text-xs font-bold text-slate-300 w-10">48px</span>
          </div>
        </div>

        <div>
          <label class="block text-[11px] text-slate-400 mb-1">Tamanho dos Textos Fora</label>
          <div class="flex items-center gap-2">
            <input id="outerFontSizeRange" type="range" min="16" max="48" value="28" oninput="updateFontStyles()" class="w-full accent-blue-500 cursor-pointer">
            <span id="outerFontSizeVal" class="text-xs font-bold text-slate-300 w-10">28px</span>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Cor da Água</label>
        <input id="liquidColorInput" type="color" value="#3b82f6" class="w-full h-8 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer">
      </div>
    </div>

    <!-- ABA 3: ÁUDIO E CONFIGURAÇÕES DO OBS -->
    <div id="tab-settings" class="tab-content hidden space-y-4">
      <div class="space-y-3 bg-slate-900/50 p-3 rounded-xl border border-slate-700/60">
        <span class="text-xs font-bold text-blue-400 uppercase tracking-wider block">🔊 Configurações de Áudio</span>
        <button id="soundToggleBtn" onclick="toggleSound()" class="w-full h-9 bg-slate-700 hover:bg-slate-600 text-xs font-bold rounded-lg text-emerald-400 border border-slate-600 transition">
          🔊 Som: LIGADO
        </button>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Volume dos Efeitos</label>
          <div class="flex items-center gap-2">
            <input id="volumeInput" type="range" min="0" max="100" value="80" oninput="updateVolume()" class="w-full accent-blue-500 cursor-pointer">
            <span id="volumeValue" class="text-xs font-bold text-slate-300 w-8">80%</span>
          </div>
        </div>
      </div>

      <div class="pt-2">
        <label class="block text-xs font-medium text-slate-400 mb-2">Fundo para Stream / OBS</label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="setBg('dark')" class="bg-slate-900 hover:bg-slate-950 text-xs py-2 rounded border border-slate-700 font-medium">Escuro</button>
          <button onclick="setBg('chroma')" class="bg-green-500 hover:bg-green-600 text-black font-bold text-xs py-2 rounded">Croma Key</button>
          <button onclick="setBg('transparent')" class="bg-slate-700 hover:bg-slate-600 text-xs py-2 rounded font-medium">Transparente</button>
        </div>
      </div>
    </div>

    <!-- ABA 4: CONEXÃO COM STREAMLABS / LIVEPIX -->
    <div id="tab-connections" class="tab-content hidden space-y-4">
      <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/60 space-y-3">
        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block">⚡ LivePix via Streamlabs</span>
        
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">Streamlabs Socket API Token</label>
          <input id="streamlabsTokenInput" type="password" placeholder="Cole o token do Streamlabs aqui..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-blue-500">
        </div>

        <div class="flex items-center justify-between pt-1">
          <button onclick="connectStreamlabsSocket()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2 rounded-lg transition shadow">
            🔌 Conectar ao LivePix / Streamlabs
          </button>
        </div>
        <p id="connectionStatus" class="text-[10px] text-slate-400 text-center">Status: Desconectado</p>
      </div>
    </div>

  </div>

  <!-- Botão Flutuante para Exibir o Painel -->
  <button id="showPanelBtn" class="fixed bottom-4 right-4 bg-slate-800 text-blue-400 p-3 rounded-full border border-slate-700 shadow-xl hidden z-50 hover:bg-slate-700 transition">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
  </button>

  <script>
    const targetInput = document.getElementById('targetInput');
    const currentInput = document.getElementById('currentInput');
    const centerDisplay = document.getElementById('centerDisplay');
    const liquidWrapper = document.getElementById('liquidWrapper');
    const liquidFill = document.getElementById('liquidFill');
    const waveFront = document.getElementById('waveFront');
    const jarWrapper = document.getElementById('jarWrapper');
    const jarBody = document.getElementById('jarBody');
    const jarLid = document.getElementById('jarLid');
    const jarNeck = document.getElementById('jarNeck');
    const headerTextDisplay = document.getElementById('headerTextDisplay');
    const footerTextDisplay = document.getElementById('footerTextDisplay');
    const headerInput = document.getElementById('headerInput');
    const footerInput = document.getElementById('footerInput');
    const liquidColorInput = document.getElementById('liquidColorInput');
    const widgetContainer = document.getElementById('widgetContainer');
    
    // Controles de fontes e cores
    const jarTextColorInput = document.getElementById('jarTextColorInput');
    const outerTextColorInput = document.getElementById('outerTextColorInput');
    const jarFontSizeRange = document.getElementById('jarFontSizeRange');
    const jarFontSizeVal = document.getElementById('jarFontSizeVal');
    const outerFontSizeRange = document.getElementById('outerFontSizeRange');
    const outerFontSizeVal = document.getElementById('outerFontSizeVal');
    const customAmountInput = document.getElementById('customAmountInput');

    const controlPanel = document.getElementById('controlPanel');
    const togglePanelBtn = document.getElementById('togglePanelBtn');
    const showPanelBtn = document.getElementById('showPanelBtn');
    const displayModeSelect = document.getElementById('displayModeSelect');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const volumeInput = document.getElementById('volumeInput');
    const volumeValue = document.getElementById('volumeValue');
    const explosionCanvas = document.getElementById('explosionCanvas');
    const ctx = explosionCanvas.getContext('2d');

    // Conexão Streamlabs
    const streamlabsTokenInput = document.getElementById('streamlabsTokenInput');
    const connectionStatus = document.getElementById('connectionStatus');
    let streamlabsSocket = null;

    // Carregar dados salvos no localStorage
    let currentAmount = parseFloat(localStorage.getItem('jar_current')) || 0;
    let targetAmount = parseFloat(localStorage.getItem('jar_target')) || 100;
    let isExploded = false;
    let isExplodingSequence = false;
    let displayMode = 'percent';
    let particles = [];
    let soundEnabled = true;
    let masterVolume = 0.8;

    currentInput.value = currentAmount;
    targetInput.value = targetAmount;
    if (localStorage.getItem('jar_header')) headerInput.value = localStorage.getItem('jar_header');
    if (localStorage.getItem('jar_footer')) footerInput.value = localStorage.getItem('jar_footer');
    if (localStorage.getItem('jar_color')) liquidColorInput.value = localStorage.getItem('jar_color');
    if (localStorage.getItem('sl_token')) {
      streamlabsTokenInput.value = localStorage.getItem('sl_token');
      connectStreamlabsSocket();
    }
    
    headerTextDisplay.innerText = headerInput.value;
    footerTextDisplay.innerText = footerInput.value;

    let audioCtx = null;

    // Sistema de Troca de Abas do Menu
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      document.getElementById(`tabBtn-${tabName}`).classList.add('active');
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function updateVolume() {
      masterVolume = parseFloat(volumeInput.value) / 100;
      volumeValue.innerText = `${volumeInput.value}%`;
    }

    function updateFontStyles() {
      const jarSize = jarFontSizeRange.value;
      const outerSize = outerFontSizeRange.value;

      jarFontSizeVal.innerText = `${jarSize}px`;
      outerFontSizeVal.innerText = `${outerSize}px`;

      centerDisplay.style.fontSize = `${jarSize}px`;
      headerTextDisplay.style.fontSize = `${outerSize}px`;
      footerTextDisplay.style.fontSize = `${Math.max(16, outerSize - 6)}px`;

      centerDisplay.style.color = jarTextColorInput.value;
      headerTextDisplay.style.color = outerTextColorInput.value;
      footerTextDisplay.style.color = outerTextColorInput.value;
    }

    jarTextColorInput.addEventListener('input', updateFontStyles);
    outerTextColorInput.addEventListener('input', updateFontStyles);

    function playWaterSplashSound() {
      if (!soundEnabled || masterVolume === 0) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
        
        gain.gain.setValueAtTime(0.3 * masterVolume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {}
    }

    function playShakeSound() {
      if (!soundEnabled || masterVolume === 0) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.8);
        
        gain.gain.setValueAtTime(0.1 * masterVolume, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.4 * masterVolume, audioCtx.currentTime + 0.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      } catch (e) {}
    }

    function playExplosionSound() {
      if (!soundEnabled || masterVolume === 0) return;
      try {
        initAudio();
        const bufferSize = audioCtx.sampleRate * 0.5;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.8 * masterVolume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();

        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          
          noteGain.gain.setValueAtTime(0, audioCtx.currentTime + 0.1 + (idx * 0.05));
          noteGain.gain.linearRampToValueAtTime(0.2 * masterVolume, audioCtx.currentTime + 0.15 + (idx * 0.05));
          noteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2 + (idx * 0.05));

          osc.connect(noteGain);
          noteGain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + 0.1 + (idx * 0.05));
          osc.stop(audioCtx.currentTime + 1.3 + (idx * 0.05));
        });

      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundToggleBtn.innerText = "🔊 Som: LIGADO";
        soundToggleBtn.classList.remove('text-rose-400');
        soundToggleBtn.classList.add('text-emerald-400');
      } else {
        soundToggleBtn.innerText = "🔇 Som: DESLIGADO";
        soundToggleBtn.classList.remove('text-emerald-400');
        soundToggleBtn.classList.add('text-rose-400');
      }
    }

    function resizeCanvas() {
      explosionCanvas.width = window.innerWidth;
      explosionCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function formatCurrency(val) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
    }

    function changeDisplayMode() {
      displayMode = displayModeSelect.value;
      updateJarState();
    }

    function saveState() {
      localStorage.setItem('jar_current', currentAmount);
      localStorage.setItem('jar_target', targetAmount);
      localStorage.setItem('jar_header', headerInput.value);
      localStorage.setItem('jar_footer', footerInput.value);
      localStorage.setItem('jar_color', liquidColorInput.value);
      localStorage.setItem('sl_token', streamlabsTokenInput.value);
    }

    function updateJarState() {
      targetAmount = Math.max(1, parseFloat(targetInput.value) || 1);
      currentAmount = Math.max(0, parseFloat(currentInput.value) || 0);

      saveState();

      const percentage = Math.min(100, (currentAmount / targetAmount) * 100);

      if (displayMode === 'percent') {
        centerDisplay.style.display = 'block';
        centerDisplay.innerText = `${Math.floor(percentage)}%`;
      } else if (displayMode === 'value') {
        centerDisplay.style.display = 'block';
        centerDisplay.innerText = formatCurrency(currentAmount);
      } else {
        centerDisplay.style.display = 'none';
      }

      liquidWrapper.style.height = `${percentage}%`;

      const lidAngle = -12 - (percentage * 0.15);
      jarLid.style.transform = `translateX(-50%) rotateX(35deg) rotateZ(${lidAngle}deg) translateY(${-percentage * 0.2}px)`;

      if (percentage >= 100 && !isExploded && !isExplodingSequence) {
        triggerExplosionSequence();
      }
    }

    function triggerSlosh() {
      jarBody.classList.remove('slosh-jar');
      void jarBody.offsetWidth;
      jarBody.classList.add('slosh-jar');
    }

    function addAmount(amount) {
      initAudio();
      currentAmount += amount;
      currentInput.value = currentAmount;
      playWaterSplashSound();
      triggerSlosh();
      updateJarState();
    }

    function addCustomAmount() {
      const val = parseFloat(customAmountInput.value.replace(',', '.'));
      if (!isNaN(val) && val > 0) {
        addAmount(val);
        customAmountInput.value = '';
      } else {
        alert('Por favor, insira um valor válido maior que zero.');
      }
    }

    // CONEXÃO DE EVENTOS EM TEMPO REAL (STREAMLABS + LIVEPIX)
    function connectStreamlabsSocket() {
      const token = streamlabsTokenInput.value.trim();
      if (!token) {
        connectionStatus.innerText = "Status: Insira um Token válido.";
        connectionStatus.className = "text-[10px] text-rose-400 text-center";
        return;
      }

      saveState();

      if (streamlabsSocket) {
        streamlabsSocket.disconnect();
      }

      streamlabsSocket = io(`https://sockets.streamlabs.com?token=${token}`, { transports: ['websocket'] });

      streamlabsSocket.on('connect', () => {
        connectionStatus.innerText = "Status: Conectado com Sucesso ao LivePix / Streamlabs!";
        connectionStatus.className = "text-[10px] text-emerald-400 text-center font-bold";
      });

      streamlabsSocket.on('event', (eventData) => {
        if (eventData.type === 'donation' || eventData.for === 'streamlabs') {
          const message = eventData.message[0];
          if (message && message.amount) {
            const amount = parseFloat(message.amount);
            addAmount(amount);
          }
        }
      });

      streamlabsSocket.on('disconnect', () => {
        connectionStatus.innerText = "Status: Desconectado.";
        connectionStatus.className = "text-[10px] text-rose-400 text-center";
      });
    }

    function resetJar(manual = false) {
      currentAmount = 0;
      currentInput.value = 0;
      restoreJar();
      updateJarState();
    }

    function triggerExplosionSequence(isTest = false) {
      if (isExplodingSequence) return;
      isExplodingSequence = true;

      initAudio();
      playShakeSound();

      if (isTest) {
        currentAmount = targetAmount;
        currentInput.value = targetAmount;
        updateJarState();
      }

      jarBody.classList.add('shake-jar');

      setTimeout(() => {
        jarBody.classList.remove('shake-jar');
        explodeJar();

        setTimeout(() => {
          rebuildJarWithIncreasedTarget();
        }, 3500);

      }, 900);
    }

    function explodeJar() {
      isExploded = true;

      jarBody.style.opacity = '0';
      jarLid.style.opacity = '0';
      jarNeck.style.opacity = '0';

      playExplosionSound();

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 200,
          spread: 100,
          origin: { y: 0.6 }
        });
      }

      createExplosionParticles();
    }

    function rebuildJarWithIncreasedTarget() {
      // Adiciona 35 em cima do valor atual para evitar bater a meta 2x seguidas
      targetAmount = currentAmount + 35;
      targetInput.value = targetAmount;
      
      jarBody.style.opacity = '1';
      jarLid.style.opacity = '1';
      jarNeck.style.opacity = '1';

      jarWrapper.classList.add('rebuilding-jar');

      setTimeout(() => {
        jarWrapper.classList.remove('rebuilding-jar');
        isExploded = false;
        isExplodingSequence = false;
        updateJarState();
      }, 800);
    }

    function restoreJar() {
      isExploded = false;
      isExplodingSequence = false;
      jarBody.style.opacity = '1';
      jarLid.style.opacity = '1';
      jarNeck.style.opacity = '1';
      jarBody.classList.remove('shake-jar');
      jarWrapper.classList.remove('rebuilding-jar');
    }

    function createExplosionParticles() {
      particles = [];
      const rect = jarBody.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const currentColor = liquidColorInput.value;

      for (let i = 0; i < 45; i++) {
        particles.push({
          x: centerX,
          y: centerY,
          vx: (Math.random() - 0.5) * 20,
          vy: (Math.random() - 0.5) * 20 - 5,
          size: Math.random() * 12 + 6,
          color: 'rgba(255, 255, 255, 0.85)',
          type: 'glass',
          rotation: Math.random() * Math.PI,
          vRot: (Math.random() - 0.5) * 0.3,
          opacity: 1
        });
      }

      for (let i = 0; i < 70; i++) {
        particles.push({
          x: centerX,
          y: centerY,
          vx: (Math.random() - 0.5) * 24,
          vy: (Math.random() - 0.5) * 24 - 7,
          size: Math.random() * 9 + 4,
          color: currentColor,
          type: 'water',
          opacity: 1
        });
      }

      animateParticles();
    }

    function animateParticles() {
      ctx.clearRect(0, 0, explosionCanvas.width, explosionCanvas.height);

      let alive = false;
      particles.forEach(p => {
        if (p.opacity > 0) {
          alive = true;
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.38;
          p.opacity -= 0.014;

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.opacity);

          if (p.type === 'glass') {
            p.rotation += p.vRot;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.fillStyle = p.color;
            ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -p.size);
            ctx.lineTo(p.size, p.size);
            ctx.lineTo(-p.size, p.size);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }
      });

      if (alive) {
        requestAnimationFrame(animateParticles);
      } else {
        ctx.clearRect(0, 0, explosionCanvas.width, explosionCanvas.height);
      }
    }

    targetInput.addEventListener('input', updateJarState);
    currentInput.addEventListener('input', updateJarState);

    headerInput.addEventListener('input', (e) => {
      headerTextDisplay.innerText = e.target.value;
      saveState();
    });

    footerInput.addEventListener('input', (e) => {
      footerTextDisplay.innerText = e.target.value;
      saveState();
    });

    liquidColorInput.addEventListener('input', (e) => {
      updateWaterColor(e.target.value);
      saveState();
    });

    function updateWaterColor(color) {
      document.documentElement.style.setProperty('--liquid-color', color);
      liquidFill.style.background = `linear-gradient(180deg, ${color} 0%, #1d4ed8 100%)`;
      waveFront.style.fill = color;
    }

    function setBg(type) {
      const body = document.getElementById('body');
      body.classList.remove('bg-slate-900', 'bg-chroma', 'bg-transparent-obs');

      if (type === 'dark') {
        body.classList.add('bg-slate-900');
      } else if (type === 'chroma') {
        body.classList.add('bg-chroma');
      } else if (type === 'transparent') {
        body.classList.add('bg-transparent-obs');
      }
    }

    togglePanelBtn.addEventListener('click', () => {
      controlPanel.classList.add('hidden');
      showPanelBtn.classList.remove('hidden');
      widgetContainer.classList.add('md:mx-auto');
    });

    showPanelBtn.addEventListener('click', () => {
      controlPanel.classList.remove('hidden');
      showPanelBtn.classList.add('hidden');
      widgetContainer.classList.remove('md:mx-auto');
    });

    // Inicialização
    updateFontStyles();
    updateWaterColor(liquidColorInput.value);
    updateJarState();
  </script>
</body>
</html>
